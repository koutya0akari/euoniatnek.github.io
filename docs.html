<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="site.js" defer></script>
    <style>
        .main-content { max-width: 900px; }
        
        /* ドキュメントカードのスタイル */
        .docs-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        .doc-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid #eee;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .doc-card:hover {
            transform: none !important;           /* 上に浮き上がる動きをなくす */
            box-shadow: 0 2px 8px rgba(0,0,0,0.05) !important; /* 影を通常時と同じにする */
            border-color: #eee !important;        /* 枠線の色を通常時と同じ（#eee）にする */
        }
        .doc-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .doc-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            margin: 0;
            cursor: default;
        }
        .doc-link {
             color: var(--primary-color) !important; /* 常にテーマのメインカラー（青系）を維持 */
             text-decoration: none;
             transition: opacity 0.2s;
        }
        .doc-link:visited {
             color: var(--primary-color) !important; /* クリック後も色を変えない */
        }
        .doc-link:hover { 
            text-decoration: underline;
            opacity: 0.8;
        }
        .doc-date {
            font-size: 0.9rem;
            color: var(--accent-gray);
            background: #f0f2f5;
            padding: 4px 10px;
            border-radius: 20px;
        }
        .doc-description {
            color: var(--text-color);
            line-height: 1.6;
            font-size: 1rem;
            border-top: 1px solid #f0f2f5; 
            padding-top: 24px; 
            margin-top: 5px;
        }
        .doc-footer {
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main-content { max-width: none; }
            .docs-grid { gap: 1rem; }
            .doc-card { padding: 1.25rem; border-radius: 10px; }
            .doc-header {
                flex-direction: column;
                gap: 0.75rem;
            }
            .doc-title {
                font-size: 1.1rem;
                line-height: 1.4;
            }
            .doc-date {
                align-self: flex-start;
                border-radius: 999px;
            }
            .doc-description {
                padding-top: 1rem;
                margin-bottom: 0;
            }
        }
    </style>
</head>
<body>
   
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Kenta Inoue</h2><p>@sugakutoprecure</p></div>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
                <i class="fa-solid fa-bars"></i>
                <span>メニュー</span>
            </button>
            <nav class="nav-menu" id="site-nav">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html" class="active"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                    <li><a href="literature.html"><i class="fa-solid fa-bookmark"></i> 文献</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h1>公開文書</h1>
            <p>勉強したことをまとめたPDF一覧です。</p>
            
            <div id="docs-list" class="docs-grid">
                </div>
        </main>
    </div>

    <script>
        /**
         * 【ここを更新するだけ！】
         * 新しいドキュメントを追加する場合は、以下のオブジェクトを配列に追加してください。
         */
        const myDocuments = [
            {
                title: "交叉理論についての覚書",
                date: "2026-05-2",
                url: "https://drive.google.com/file/d/14mtbIR59u2Ahb_Dx_HwchlrQArmYLrdk/view?usp=sharing",
                description: "私が勉強している交叉理論について、代数的サイクルの定義からGrothendieck-Rieman-Rochの定理の証明までまとめたPDF（に育てるつもり）です。"
            } //2つ目以降の最後には","をつける！            
        ];

        function renderDocs() {
            const container = document.getElementById('docs-list');
            // 日付の新しい順にソート
            const sortedDocs = myDocuments.sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = '';
            sortedDocs.forEach(doc => {
                const displayDate = doc.date.replace(/-/g, '/');
                html += `
                    <div class="doc-card">
                        <div class="doc-header">
                            <h2 class="doc-title">
                                <a href="${doc.url}" target="_blank" class="doc-link">
                                    ${doc.title} <i class="fas fa-external-link-alt" style="font-size: 0.9rem;"></i>
                                </a>
                            </h2>
                            <span class="doc-date">${displayDate}</span>
                        </div>
                        <p class="doc-description">${doc.description}</p>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // 初期表示
        window.addEventListener('DOMContentLoaded', renderDocs);
        　　　　
    </script>
</body>
</html>
