<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Literature - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="site.js" defer></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .main-content { max-width: 900px; overflow-x: hidden; }
        
        /* 文献リストのスタイル */
        .literature-grid { display: flex; flex-direction: column; gap: 20px; margin-top: 20px; }
        .literature-card {
            background: white; padding: 25px; border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee; transition: 0.3s; display: flex;
            flex-direction: column; gap: 10px;
        }
         .literature-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .lit-title { font-size: 1.2rem; font-weight: bold; margin: 0px; }
        .lit-title a { color: var(--primary-color); text-decoration: none; }
        .lit-title a:hover { text-decoration: underline; }
        
        .lit-memo { 
            font-size: 1rem; line-height: 1.6; color: var(--text-color);
            border-top: 1px solid #f0f2f5; padding-top: 10px; margin-top: 5px;
        }
        .lit-footer {
            margin-top: 5px;
        }

        @media (max-width: 768px) {
            .main-content { max-width: none; overflow-x: visible; }
            .literature-grid { gap: 1rem; }
            .literature-card { padding: 1.25rem; border-radius: 10px; }
            .lit-title {
                font-size: 1.1rem;
                line-height: 1.4;
            }
            .lit-memo {
                padding-top: 1rem;
                overflow-wrap: anywhere;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Kenta Inoue</h2><p>@sugakutoprecure</p></div>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
                <i class="fa-solid fa-bars"></i>
                <span>メニュー</span>
            </button>
            <nav class="nav-menu" id="site-nav">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                    <li><a href="literature.html" class="active"><i class="fa-solid fa-bookmark"></i> 文献</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <h1>文献</h1>
            <p>現在読んでいたり、気になっている文献のリストです。</p>
            <div id="literature-list" class="literature-grid">
                </div>
        </main>
    </div>

    <script>
        /**
         * 【ここを追加・編集するだけ！】
         */
        const myLiterature = [           
           {
                title: "Fulton 『Intersection Theory』",
                url: "https://link.springer.com/book/10.1007/978-1-4612-1700-8", // URLがない場合は空にする
                memo: `私が講究で読んでいる本で、交叉理論についての標準的なテキストです。
                    Moving lemma ではなく、Deformation to normal cone を用いた交叉積の構成について詳しく学ぶことができます。
                    巷では難しいとよく言われますが、大量のExampleをすべて追うことに固執しなければ、いくぶんか取り組みやすいと思います。`
            } //2つ目以降の最後には","をつける！
        ];

        function renderLiterature() {
            const container = document.getElementById('literature-list');
            let html = '';

            myLiterature.forEach(item => {
                // URLがある場合だけリンクにする処理
                const titleHtml = item.url 
                    ? `<a href="${item.url}" target="_blank">${item.title} <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.8rem;"></i></a>`
                    : item.title;

                html += `
                    <div class="literature-card">
                        <div class="lit-title">${titleHtml}</div>
                        <div class="lit-memo">${marked.parse(item.memo)}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
            if (window.MathJax) MathJax.typesetPromise([container]);
        }

        window.addEventListener('DOMContentLoaded', renderLiterature);
    </script>
</body>
</html>
