<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary - My Site</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="site.js" defer></script>
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>window.MathJax = { tex: { inlineMath: [['$', '$']] } };</script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        .main-content { max-width: 900px; overflow-x: hidden; }
        
        /* 階層ナビゲーション */
        .archive-container { display: grid; gap: 1.5rem; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); margin-top: 20px; }
        .archive-card {
            background: white; padding: 2rem; border-radius: 12px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #eee;
            cursor: pointer; transition: 0.3s; text-decoration: none; color: inherit;
        }
        .archive-card:hover { transform: translateY(-5px); border-color: var(--primary-color); }
        .archive-card h2 { margin: 0; }

        /* 月別表示（ストリーム） */
        .monthly-posts-container { display: flex; flex-direction: column; gap: 40px; margin-top: 30px; }
        .diary-post { solid var(--primary-color); padding-left: 0px; width: 100%; }
        .diary-post-date { font-size: 1.2rem; font-weight: bold; color: var(--accent-gray); margin-bottom: 10px; }
        .diary-body { font-family: inherit; line-height: 1.8; word-wrap: break-word; }

        .breadcrumb { margin-bottom: 20px; color: var(--accent-gray); font-weight: bold; font-size: 0.9rem; min-height: 1.5em; }
        .breadcrumb span { cursor: pointer; }
        .breadcrumb span:hover { color: var(--primary-color); text-decoration: underline; }

        @media (max-width: 768px) {
            .main-content { max-width: none; overflow-x: visible; }
            .archive-container { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
            .archive-card { padding: 1.25rem; border-radius: 10px; }
            .monthly-posts-container { gap: 28px; margin-top: 20px; }
            .diary-post-date { font-size: 1rem; }
            .diary-body { line-height: 1.75; }
            .breadcrumb { overflow-wrap: anywhere; }
        }

        @media (max-width: 420px) {
            .archive-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <aside class="sidebar">
            <div class="profile"><h2>Kenta Inoue</h2><p>@sugakutoprecure</p></div>
            <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
                <i class="fa-solid fa-bars"></i>
                <span>メニュー</span>
            </button>
            <nav class="nav-menu" id="site-nav">
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> ホーム</a></li>
                    <li><a href="diary.html" class="active"><i class="fa-solid fa-book"></i> 日記</a></li>
                    <li><a href="docs.html"><i class="fa-solid fa-file-lines"></i> 公開文書</a></li>
                    <li><a href="literature.html"><i class="fa-solid fa-bookmark"></i> 文献</a></li>
                </ul>
            </nav>
        </aside>

        <main class="main-content">
            <nav class="breadcrumb" id="breadcrumb"></nav>
            <div id="diary-view"></div>
        </main>
    </div>

    <script>
        /**
         * 日記リスト：新しい順に並べてください
         */
        const diaryPosts = [
            "2026-05-02",
            "2026-05-01",
            "2026-04-30",
            "2026-04-29"
        ];

        const view = document.getElementById('diary-view');
        const breadcrumb = document.getElementById('breadcrumb');

        function init() {
            const params = new URLSearchParams(window.location.search);
            const year = params.get('year');
            const month = params.get('month');

            if (year && month) {
                // 特定の年月が指定されている場合
                renderMonthlyStream(year, month);
            } else if (year) {
                // 年だけ指定されている場合（その年の月一覧）
                renderMonthList(year);
            } else {
                // 【追加機能】何も指定がない場合は最新の月を表示
                if (diaryPosts.length > 0) {
                    const [latestY, latestM] = diaryPosts[0].split('-');
                    renderMonthlyStream(latestY, latestM, true);
                } else {
                    view.innerHTML = "<h1>Diary</h1><p>日記はまだありません。</p>";
                }
            }
        }

        // 1. 年一覧（アーカイブ画面）を表示
        function renderYearList() {
            // URLからパラメータを消してトップ画面にする
            window.history.pushState({}, '', 'diary.html');
            breadcrumb.innerHTML = ` 過去の日記`;
            
            const years = [...new Set(diaryPosts.map(id => id.split('-')[0]))].sort((a,b) => b-a);
            let html = '<h1>過去の日記</h1><div class="archive-container">';
            years.forEach(y => {
                html += `<a href="?year=${y}" class="archive-card"><h2>${y}年</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 2. 月一覧を表示
        function renderMonthList(year) {
            breadcrumb.innerHTML = `<span onclick="renderYearList()">過去の日記</span> > ${year}年`;
            const months = [...new Set(diaryPosts.filter(id => id.startsWith(year)).map(id => id.split('-')[1]))].sort((a,b) => b-a);
            let html = `<h1>${year}年</h1><div class="archive-container">`;
            months.forEach(m => {
                html += `<a href="?year=${year}&month=${m}" class="archive-card"><h2>${parseInt(m)}月</h2></a>`;
            });
            view.innerHTML = html + '</div>';
        }

        // 3. ひと月分を縦に並べて表示
        async function renderMonthlyStream(year, month, isDefault = false) {
            // パンくずの表示切り替え
            if (isDefault) {
                // 初期表示時はアーカイブへ戻るリンクを出す
                breadcrumb.innerHTML = `<span onclick="renderYearList()"><i class="fa-solid fa-list"></i> 過去の日記一覧を表示</span>`;
            } else {
                breadcrumb.innerHTML = `<span onclick="renderYearList()">過去の日記</span> > <span onclick="location.href='?year=${year}'">${year}年</span> > ${parseInt(month)}月`;
            }
            
            const posts = diaryPosts.filter(id => id.startsWith(`${year}-${month}`)).sort((a,b) => b-a);
            view.innerHTML = `<h1>${year}年${parseInt(month)}月</h1><div id="posts-stream" class="monthly-posts-container">読み込み中...</div>`;
            
            const stream = document.getElementById('posts-stream');
            let allHtml = '';

            for (const id of posts) {
                try {
                    const res = await fetch(`posts/${id}.md`);
                    if(!res.ok) continue;
                    const md = await res.text();
                    const htmlContent = marked.parse(md);
                    const [y, m, d] = id.split('-');
                    
                    allHtml += `
                        <section class="diary-post">
                            <div class="diary-post-date">${y}/${m}/${d}</div>
                            <div class="card diary-body">${htmlContent}</div>
                        </section>
                    `;
                } catch (e) { console.error(e); }
            }
            
            stream.innerHTML = allHtml;
            if (window.MathJax) MathJax.typesetPromise([stream]);
        }

        init();
        　　　　　　
    </script>
</body>
</html>
